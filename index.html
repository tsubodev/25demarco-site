	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('vendor/potree-1.8.2/build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container" hidden></div>
	</div>

	<script type="module">

	import * as THREE from "./vendor/potree-1.8.2/libs/three.js/build/three.module.js";

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.setEDLEnabled(false);
		viewer.setFOV(60);
		viewer.setPointBudget(1_000_000);
		viewer.setBackground("white");

		viewer.setDescription("Nuvem de pontos — 6716");



		// 6716: individual node files, compatible with ordinary static hosting.
		Potree.loadPointCloud("pointclouds/6716-static-v2/cloud.js", "6716", function(e){
			viewer.scene.addPointCloud(e.pointcloud);

			let material = e.pointcloud.material;
			material.size = 0.25;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;
			material.activeAttributeName = "rgba";

			viewer.fitToScreen();
		});

	</script>
