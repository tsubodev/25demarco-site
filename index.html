<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Conheça os puxadores e seus percursos pela região da 25 de Março.">
  <link rel="icon" href="data:,">
  <title>25 de Março — Percursos</title>
	<link rel="stylesheet" type="text/css" href="vendor/potree-1.8.2/build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="vendor/potree-1.8.2/libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="vendor/potree-1.8.2/libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="vendor/potree-1.8.2/libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="vendor/potree-1.8.2/libs/jstree/themes/mixed/style.css">
  <link rel="stylesheet" href="assets/interface.css?v=fusion-1-etapas">
</head>
<body class="home-view menu-open">
  <header class="site-header">
    <h1 class="site-title"><button id="home-button" type="button" aria-label="Voltar à apresentação">TÍTULO</button></h1>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="people-menu">MENU <span aria-hidden="true">▾</span></button>
  </header>
  <main class="workspace" id="workspace" inert>
    <div class="viewer-column">
      <section class="viewer-frame" aria-label="Visualização interativa do percurso">
        <nav id="route-pages" class="page-navigation" aria-label="Páginas do puxador">
          <button id="page-previous" type="button" aria-label="Página anterior">← <span>Anterior</span></button>
          <span id="page-indicator" role="status" aria-live="polite" aria-atomic="true">1 / 9</span>
          <button id="page-next" type="button" aria-label="Próxima página"><span>Próxima</span> →</button>
        </nav>
        <div id="potree_render_area" class="potree_container"></div>
        <button id="viewer-interaction" class="viewer-interaction" type="button" aria-pressed="false">EXPLORAR NUVEM</button>
        <p id="viewer-status" class="viewer-status" role="status">Selecione um puxador para conhecer seu percurso.</p>
      </section>
      <section id="tiago-moments" class="moments-panel" aria-labelledby="moments-title" hidden>
        <h3 id="moments-title">Momentos do percurso</h3>
        <div id="moment-views" class="moment-views" role="group" aria-label="Vistas da nuvem">
          <button type="button" data-moment="overview" aria-pressed="true">Vista geral</button>
        </div>
        <div id="moment-description" aria-live="polite" aria-atomic="true" hidden>
          <h4 id="moment-title"></h4>
          <p id="moment-caption"></p>
        </div>
      </section>
    </div>
    <aside class="story-panel" aria-labelledby="person-heading">
      <h2 id="person-heading"><span>PUXADOR 1 - GUILHERME</span></h2>
      <img id="route-map" class="route-map" src="assets/layout/map-1.webp" alt="Mapa do percurso de Guilherme" width="1200" height="799">
      <div class="story-copy"><p id="person-story"></p></div>
      <div class="photo-column" aria-label="Fotografias do percurso"></div>
      <section id="guided-route" class="guided-route" aria-label="Visita guiada do Puxador 4" hidden>
        <details id="tour-options"><summary>VISITA GUIADA E REFERÊNCIAS</summary>
        <label><input id="tour-path" type="checkbox" checked disabled> MOSTRAR TRAJETÓRIA</label>
        <label><input id="reference-axes-toggle" type="checkbox"> MOSTRAR EIXOS XYZ</label>
        <div class="tour-buttons">
          <button id="tour-play" type="button" disabled>INICIAR VISITA</button>
          <button id="tour-pause" type="button" disabled>PAUSAR</button>
          <button id="tour-restart" type="button" disabled>REINICIAR</button>
          <button id="tour-exit" type="button" disabled>EXPLORAÇÃO LIVRE</button>
          <button id="tour-overview" type="button">VISTA GERAL</button>
        </div>
        <progress id="tour-progress" max="1" value="0" aria-label="Progresso da visita"></progress>
        <p id="tour-status" role="status">Carregando percurso…</p>
        </details>
      </section>
    </aside>
  </main>
  <section id="start-menu" class="start-screen" aria-label="Apresentação">
    <div id="home-content">
      <button class="start-button" type="button">iniciar <span aria-hidden="true">&gt;</span></button>
      <div class="intro-copy"><h2>TÍTULO</h2><p id="introduction"></p></div>
      <footer class="credits"><p>estúdio vertical, escola da cidade - 2026</p><p>desenvolvido por: gabriel wissenbach, heloysa lobl, pedro sales, rachel haddad, yuri tsubouchi</p></footer>
    </div>
    <nav id="people-menu" class="people-menu" aria-label="Escolha um puxador" hidden>
      <button class="person-option" type="button" data-person="1">PUXADOR 1 - GUILHERME</button>
      <button class="person-option" type="button" data-person="2">PUXADOR 2 - EMILY</button>
      <button class="person-option" type="button" data-person="3">PUXADOR 3 - TIAGO</button>
      <button class="person-option" type="button" data-person="4">PUXADOR 4 - BENNE</button>
    </nav>
  </section>
	<script src="vendor/potree-1.8.2/libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="vendor/potree-1.8.2/libs/spectrum/spectrum.js"></script>
	<script src="vendor/potree-1.8.2/libs/jquery-ui/jquery-ui.min.js"></script>


	<script src="vendor/potree-1.8.2/libs/other/BinaryHeap.js"></script>
	<script src="vendor/potree-1.8.2/libs/tween/tween.min.js"></script>
	<script src="vendor/potree-1.8.2/libs/d3/d3.js"></script>
	<script src="vendor/potree-1.8.2/libs/proj4/proj4.js"></script>
	<script src="vendor/potree-1.8.2/libs/openlayers3/ol.js"></script>
	<script src="vendor/potree-1.8.2/libs/i18next/i18next.js"></script>
	<script src="vendor/potree-1.8.2/libs/jstree/jstree.js"></script>
	<script src="vendor/potree-1.8.2/build/potree/potree.js"></script>
	<script src="vendor/potree-1.8.2/libs/plasio/js/laslaz.js"></script>

  <script type="module" src="assets/interface.js?v=fusion-1-cache-2"></script>
</body>
</html>
